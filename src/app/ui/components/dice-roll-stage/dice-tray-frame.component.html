<div
  class="rounded-ui-sm relative block w-full max-w-104 overflow-hidden bg-[#3d4048] shadow-[inset_0_1px_3px_rgba(0,0,0,0.5)]"
  data-testid="dice-roll-stage"
  [style.aspect-ratio]="frame().aspect"
  [attr.data-state]="frame().diceThrow?.phase ?? 'waiting'"
  [attr.data-shown]="frame().diceThrow?.shown?.join(' ') ?? ''"
>
  <canvas #canvas class="block size-full"></canvas>
  @if (frame().overflow > 0) {
    <span class="absolute right-1.5 bottom-1 text-[11px] font-semibold text-white/75">+{{ frame().overflow }}</span>
  }
</div>
