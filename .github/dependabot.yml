version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      - dependency-name: conventional-changelog-conventionalcommits
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # 22.1.5〜22.1.xの@angular/buildはunit-testビルダーがsetupFilesを適用しなくなり、
      # happy-domに無いWebRTCを補うスタブが走らないまま@skyway-sdk/coreを読み込んで
      # 全specが落ちた。22.2.0では直っているのを確かめたうえで、package.jsonの完全一致の固定を22.2.0へ移している。
      # 提案は止めたままにして、ng testが通ることを見てから手で上げる。
      - dependency-name: '@angular/build'
      - dependency-name: '@angular/cli'
      # vitest 5は@angular/buildが受け付けない（peerはvitest ^4.0.8。22.1.7でも同じ）。
      # ng testはそのビルダー越しに走るので、上げるとnpm installの時点で解決しない。
      # Angular側がvitest 5を受けるまでは提案も止める。
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: '@vitest/coverage-v8'
        update-types:
          - version-update:semver-major
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-*'
          - 'ng-*'
          - '@ng-*'
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
